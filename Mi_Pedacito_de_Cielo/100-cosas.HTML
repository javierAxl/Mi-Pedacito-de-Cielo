<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ashley</title>

    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Georgia", serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45) 0 4px, transparent 5px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.35) 0 3px, transparent 4px),
        linear-gradient(135deg, #ffd6e7, #f8b6c9, #e8a6b8, #f7d9c4);
    background-size: 180px 180px, 220px 220px, 100% 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #4a2633;
    padding: 25px;
}

/* Decoración romántica */
body::before {
    content: "♥";
    position: fixed;
    top: 8%;
    left: 8%;
    font-size: 55px;
    color: rgba(255, 255, 255, 0.55);
    transform: rotate(-15deg);
    pointer-events: none;
}

body::after {
    content: "♥";
    position: fixed;
    bottom: 8%;
    right: 8%;
    font-size: 65px;
    color: rgba(255, 255, 255, 0.5);
    transform: rotate(15deg);
    pointer-events: none;
}

.contenedor {
    width: 90%;
    max-width: 700px;
    background: rgba(255, 250, 252, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 30px;
    padding: 45px;
    text-align: center;
    box-shadow:
        0 20px 50px rgba(110, 35, 60, 0.22),
        0 0 0 8px rgba(255, 255, 255, 0.18);
    position: relative;
    overflow: hidden;
}

/* Línea decorativa superior */
.contenedor::before {
    content: "♡  ♡  ♡";
    display: block;
    color: #c94f76;
    font-size: 22px;
    letter-spacing: 8px;
    margin-bottom: 10px;
}

h1 {
    color: #a52f59;
    margin-bottom: 10px;
    font-family: "Georgia", serif;
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 1px;
}

h2 {
    color: #805263;
    font-weight: normal;
    font-style: italic;
    margin-top: 5px;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

/* Botones */
.botones {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 30px;
}

button {
    border: none;
    padding: 14px 27px;
    border-radius: 30px;
    font-family: Georgia, serif;
    font-size: 16px;
    cursor: pointer;
    background: linear-gradient(135deg, #c94f76, #a52f59);
    color: white;
    transition: all 0.3s ease;
    box-shadow: 0 6px 15px rgba(165, 47, 89, 0.25);
}

button:hover {
    transform: translateY(-3px) scale(1.04);
    background: linear-gradient(135deg, #d95d84, #8f244b);
    box-shadow: 0 9px 20px rgba(165, 47, 89, 0.35);
}

button:active {
    transform: scale(0.97);
}

/* Mensaje inicial */
#mensaje {
    margin-top: 25px;
    font-size: 19px;
    min-height: 30px;
    color: #713b4d;
    font-style: italic;
    line-height: 1.6;
}

#continuar {
    display: none;
    margin: 25px auto 0;
}

/* Juego */
#juego {
    display: none;
}

.numero {
    color: #b33c65;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
    letter-spacing: 1px;
}

/* Frase */
.cosa {
    min-height: 150px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 25px;
    font-weight: bold;
    color: #542c3b;
    padding: 25px;
    line-height: 1.5;
    font-style: italic;
    position: relative;
}

.cosa::before {
    content: "“";
    color: #d47796;
    font-size: 65px;
    position: absolute;
    top: -5px;
    left: 5px;
    opacity: 0.5;
}

.cosa::after {
    content: "”";
    color: #d47796;
    font-size: 65px;
    position: absolute;
    bottom: -30px;
    right: 5px;
    opacity: 0.5;
}

/* Historial */
.historial {
    margin-top: 30px;
    text-align: left;
    max-height: 220px;
    overflow-y: auto;
    border-top: 1px solid #e8bdca;
    padding-top: 15px;
}

.historial h3 {
    text-align: center;
    color: #a52f59;
    font-size: 18px;
}

.historial ol {
    padding-left: 25px;
}

.historial li {
    margin-bottom: 8px;
    color: #69404e;
}

.historial li::marker {
    color: #c94f76;
    font-weight: bold;
}

#siguiente {
    margin-top: 20px;
}

/* Final */
#final {
    display: none;
    font-size: 22px;
    color: #a52f59;
    font-weight: bold;
    line-height: 1.6;
    font-style: italic;
}

/* Barra de desplazamiento romántica */
.historial::-webkit-scrollbar {
    width: 7px;
}

.historial::-webkit-scrollbar-track {
    background: #f9e5eb;
    border-radius: 10px;
}

.historial::-webkit-scrollbar-thumb {
    background: #d47796;
    border-radius: 10px;
}

.historial::-webkit-scrollbar-thumb:hover {
    background: #a52f59;
}

/* Adaptación para celular */
@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    .contenedor {
        width: 100%;
        padding: 30px 20px;
        border-radius: 25px;
    }

    h1 {
        font-size: 27px;
    }

    h2 {
        font-size: 20px;
    }

    .cosa {
        font-size: 21px;
        min-height: 140px;
        padding: 20px;
    }

    button {
        padding: 13px 22px;
        font-size: 15px;
    }
}
    </style>
</head>

<body>

<div class="contenedor">

    <!-- INICIO -->
    <div id="inicio">

        <h1>Hola Ashley</h1>

        <h2>¿Cómo estás?</h2>

        <div class="botones">
            <button onclick="responder('bien')">Bien</button>
            <button onclick="responder('normal')">Normal</button>
            <button onclick="responder('mal')">No muy bien</button>
        </div>

        <div id="mensaje"></div>

        <button id="continuar" onclick="iniciarJuego()">
            Tengo algo para ti
        </button>

    </div>


    <!-- JUEGO -->
    <div id="juego">

        <h1>100 cosas que me gustan de ti</h1>

        <div class="numero" id="numero">
            0 / 100
        </div>

        <div class="cosa" id="cosa">
            Presiona el botón para comenzar
        </div>

        <button id="siguiente" onclick="mostrarSiguiente()">
            Siguiente
        </button>

        <div class="historial">

            <h3>Historial de este intento</h3>

            <ol id="listaHistorial"></ol>

        </div>

        <div id="final">
            Ya llegamos a las 100.
            <br><br>
            Y aun así, siento que me faltan muchas más.
        </div>

    </div>

</div>


<script>

    /*
    ==========================================================
    LAS 100 COSAS
    Puedes cambiar estas frases por las que tú quieras.
    ==========================================================
    */

    const cosas = [

        "Me gusta tu forma de ser.",
        "Me gusta tu sonrisa.",
        "Me gusta cómo hablas.",
        "Me gusta tu sentido del humor.",
        "Me gusta cómo haces que todo sea más divertido.",
        "Me gusta la manera en que ves las cosas.",
        "Me gusta cómo te preocupas por las personas que quieres.",
        "Me gusta tu forma de pensar.",
        "Me gusta cuando te emocionas por algo.",
        "Me gusta escuchar tus historias.",
        "Me gusta cuando me cuentas cómo estuvo tu día.",
        "Me gusta tu manera de expresarte.",
        "Me gusta cómo puedes hacerme sonreír.",
        "Me gusta tu personalidad.",
        "Me gusta tu forma de mirar.",
        "Me gusta cuando estás feliz.",
        "Me gusta tu manera de reír.",
        "Me gusta cuando haces bromas.",
        "Me gusta cómo haces especiales los momentos simples.",
        "Me gusta pasar tiempo contigo.",
        "Me gusta hablar contigo.",
        "Me gusta cuando tenemos conversaciones largas.",
        "Me gusta aprender cosas sobre ti.",
        "Me gusta descubrir nuevas cosas de ti.",
        "Me gusta cómo eres cuando tienes confianza.",
        "Me gusta tu sinceridad.",
        "Me gusta que seas tú misma.",
        "Me gusta tu forma de reaccionar a las cosas.",
        "Me gusta tu manera de demostrar cariño.",
        "Me gusta cuando te preocupas por mí.",
        "Me gusta que me escuches.",
        "Me gusta poder contarte cosas.",
        "Me gusta sentir que puedo hablar contigo.",
        "Me gusta tu paciencia.",
        "Me gusta tu forma de ver el lado bueno de las cosas.",
        "Me gusta cómo haces que una conversación nunca sea aburrida.",
        "Me gusta tu espontaneidad.",
        "Me gusta tu forma de sorprenderme.",
        "Me gusta cuando te ríes de mis tonterías.",
        "Me gusta cuando compartimos cosas.",
        "Me gusta conocer tus gustos.",
        "Me gusta escuchar la música que te gusta.",
        "Me gusta cuando me recomiendas algo.",
        "Me gusta cuando algo te emociona y quieres contármelo.",
        "Me gusta tu entusiasmo.",
        "Me gusta tu manera de afrontar los problemas.",
        "Me gusta tu fortaleza.",
        "Me gusta que tengas tus propias ideas.",
        "Me gusta tu creatividad.",
        "Me gusta tu forma de imaginar las cosas.",
        "Me gusta cómo haces que los días sean diferentes.",
        "Me gusta recordar momentos contigo.",
        "Me gusta crear nuevos recuerdos contigo.",
        "Me gusta cuando hablamos de cualquier cosa.",
        "Me gusta cuando terminamos riéndonos de algo.",
        "Me gusta tu manera de hacerme sentir acompañado.",
        "Me gusta que seas importante para mí.",
        "Me gusta saber que puedo contar contigo.",
        "Me gusta cuando me preguntas cómo estoy.",
        "Me gusta cuando notas pequeños detalles.",
        "Me gusta tu forma de demostrar que te importan las personas.",
        "Me gusta tu manera de querer.",
        "Me gusta cuando estás orgullosa de algo que lograste.",
        "Me gusta verte cumplir tus metas.",
        "Me gusta apoyarte en lo que haces.",
        "Me gusta escuchar tus planes.",
        "Me gusta saber cuáles son tus sueños.",
        "Me gusta imaginar todas las cosas que todavía podemos vivir.",
        "Me gusta cuando compartimos nuestros pensamientos.",
        "Me gusta tu forma de hacer sentir especial a alguien.",
        "Me gusta que tengas cosas que te hacen única.",
        "Me gusta tu manera de ser diferente.",
        "Me gusta cuando haces algo inesperado.",
        "Me gusta tu forma de alegrar un momento.",
        "Me gusta cuando simplemente hablamos sin preocuparnos por el tiempo.",
        "Me gusta cuando una conversación contigo se alarga muchísimo.",
        "Me gusta cuando tenemos nuestras propias bromas.",
        "Me gusta recordar nuestras conversaciones.",
        "Me gusta cuando me haces pensar.",
        "Me gusta que siempre haya algo nuevo que conocer de ti.",
        "Me gusta tu forma de expresar tus sentimientos.",
        "Me gusta cuando eres completamente tú.",
        "Me gusta tu confianza.",
        "Me gusta tu manera de afrontar un día difícil.",
        "Me gusta cuando intentas ayudar a alguien.",
        "Me gusta tu empatía.",
        "Me gusta que tengas personas importantes para ti.",
        "Me gusta escuchar las cosas que te apasionan.",
        "Me gusta cuando hablas de algo que realmente te gusta.",
        "Me gusta ver cómo cambia tu expresión cuando estás emocionada.",
        "Me gusta tu manera de celebrar las pequeñas cosas.",
        "Me gusta que puedas convertir un momento normal en uno especial.",
        "Me gusta todo lo que he aprendido de ti.",
        "Me gusta todo lo que todavía me falta conocer de ti.",
        "Me gusta la confianza que hemos construido.",
        "Me gusta cada recuerdo que hemos creado.",
        "Me gusta cada conversación que hemos tenido.",
        "Me gusta tenerte en mi vida.",
        "Me gusta simplemente saber que existes.",
        "Y sobre todo, me gusta que seas Ashley."
    ];


    /*
    ==========================================================
    VARIABLES DEL JUEGO
    ==========================================================
    */

    let disponibles = [];
    let historial = [];


    /*
    ==========================================================
    RESPUESTAS DE LOS 3 BOTONES
    ==========================================================
    */

    function responder(opcion) {

        const mensaje = document.getElementById("mensaje");
        const continuar = document.getElementById("continuar");

        if (opcion === "bien") {

            mensaje.innerHTML =
                "Me alegra mucho saber que estás bien. Espero poder hacer que tu día sea todavía un poquito mejor.";

        }

        else if (opcion === "normal") {

            mensaje.innerHTML =
                "Entonces espero que esto consiga convertir ese día normal en uno un poquito más bonito.";

        }

        else {

            mensaje.innerHTML =
                "Siento que no estés teniendo un día muy bueno. No puedo arreglarlo todo, pero al menos quiero intentar sacarte una pequeña sonrisa.";

        }

        continuar.style.display = "block";
    }


    /*
    ==========================================================
    INICIAR JUEGO
    ==========================================================
    */

    function iniciarJuego() {

        document.getElementById("inicio").style.display = "none";
        document.getElementById("juego").style.display = "block";

        // Copiamos las 100 frases
        disponibles = [...cosas];

        // Reiniciamos historial
        historial = [];

        document.getElementById("listaHistorial").innerHTML = "";

        mostrarSiguiente();
    }


    /*
    ==========================================================
    MOSTRAR FRASE ALEATORIA
    ==========================================================
    */

    function mostrarSiguiente() {

        if (disponibles.length === 0) {

            document.getElementById("siguiente").style.display = "none";
            document.getElementById("cosa").style.display = "none";
            document.getElementById("final").style.display = "block";

            return;
        }


        // Elegir una posición aleatoria
        const posicion =
            Math.floor(Math.random() * disponibles.length);


        // Sacar la frase del grupo disponible
        const frase =
            disponibles.splice(posicion, 1)[0];


        // Guardarla en el historial
        historial.push(frase);


        // Mostrar frase
        document.getElementById("cosa").innerHTML =
            frase;


        // Mostrar contador
        document.getElementById("numero").innerHTML =
            historial.length + " / 100";


        // Agregar al historial
        const elemento =
            document.createElement("li");

        elemento.textContent = frase;

        document.getElementById("listaHistorial")
            .appendChild(elemento);


        // Llevar el historial automáticamente al final
        const historialDiv =
            document.querySelector(".historial");

        historialDiv.scrollTop =
            historialDiv.scrollHeight;
    }

</script>

</body>
</html>
