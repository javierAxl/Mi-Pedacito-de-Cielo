<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Ashley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<canvas id="fx"></canvas>
<div class="cloud" style="top:12%;animation-delay:-10s" aria-hidden="true"></div>
<div class="cloud" style="top:38%;animation-delay:-40s;scale:.7" aria-hidden="true"></div>

<button id="secret" class="secret" aria-label="Algo brilla escondido en el cielo">🌙</button>

<main id="scene">
  <header>
    <h1>Mi pedacito de cielo</h1>
    <p id="hint">Arrastra al gatito, acarícialo y busca los tesoros escondidos.</p>
    <div id="progress" aria-live="polite">
      <div id="bar"><i id="fill"></i></div>
      <span id="count"></span>
      <div id="tray"></div>
    </div>
  </header>

  <div id="field">
    <div id="catWrap">
      <div id="bubble" role="status"></div>
      <button id="cat" aria-label="Acariciar al gato rosado">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <path class="tail" d="M146 160 Q196 150 186 104" fill="none" stroke="#f7a3c4" stroke-width="16" stroke-linecap="round"/>
          <ellipse cx="100" cy="150" rx="52" ry="42" fill="#f7a3c4"/>
          <ellipse cx="100" cy="160" rx="30" ry="26" fill="#ffd9e8"/>
          <ellipse cx="74" cy="190" rx="17" ry="10" fill="#f7a3c4"/>
          <ellipse cx="126" cy="190" rx="17" ry="10" fill="#f7a3c4"/>
          <path d="M50 74 L56 26 L90 52 Z" fill="#f7a3c4"/>
          <path d="M150 74 L144 26 L110 52 Z" fill="#f7a3c4"/>
          <path d="M60 62 L62 40 L78 54 Z" fill="#ffc4da"/>
          <path d="M140 62 L138 40 L122 54 Z" fill="#ffc4da"/>
          <ellipse cx="100" cy="86" rx="58" ry="48" fill="#f7a3c4"/>
          <g class="eyes" fill="#5a2e4a">
            <circle cx="76" cy="86" r="7"/><circle cx="124" cy="86" r="7"/>
            <circle cx="78" cy="83" r="2.4" fill="#fff"/><circle cx="126" cy="83" r="2.4" fill="#fff"/>
          </g>
          <ellipse cx="58" cy="104" rx="11" ry="6" fill="#ff8fb5" opacity=".55"/>
          <ellipse cx="142" cy="104" rx="11" ry="6" fill="#ff8fb5" opacity=".55"/>
          <path d="M94 98 h12 l-6 7z" fill="#e86a9a"/>
          <path d="M100 105 q-6 8 -13 4 M100 105 q6 8 13 4" fill="none" stroke="#5a2e4a" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M40 96 l-18 -4 M40 104 l-18 4 M160 96 l18 -4 M160 104 l18 4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M92 42 q8 -12 16 0 q-8 6 -16 0z" fill="#e86a9a"/>
        </svg>
      </button>
    </div>
  </div>
</main>

<div id="modal" class="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="big" id="mIcon"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <a class="btn" id="mLink" hidden>Abrir</a>
    <button class="btn" id="close">Guardar en mi colección</button>
  </div>
</div>

<div id="finale" class="overlay" hidden>
  <div class="card final" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <svg id="cake" viewBox="0 0 220 230" aria-hidden="true">
      <ellipse cx="110" cy="208" rx="95" ry="14" fill="#e9c6d8"/>
      <rect x="25" y="140" width="170" height="64" rx="16" fill="#ffd1e3"/>
      <path d="M25 140 H195 V156 q-14 20 -28 0 t-28 0 t-28 0 t-28 0 t-28 0 t-28 0 Z" fill="#fff"/>
      <rect x="55" y="95" width="110" height="52" rx="14" fill="#f9b8d2"/>
      <path d="M55 95 H165 V111 q-13.5 20 -27 0 t-27 0 t-27 0 t-27 0 Z" fill="#fff"/>
      <rect x="80" y="62" width="9" height="34" rx="3" fill="#bfe3f5"/>
      <rect x="106" y="62" width="9" height="34" rx="3" fill="#fff1a8"/>
      <rect x="132" y="62" width="9" height="34" rx="3" fill="#d9c2f0"/>
      <ellipse class="flame" cx="84.500" cy="52" rx="5" ry="9" fill="#ffcf5a"/>
      <ellipse class="flame" cx="110.500" cy="52" rx="5" ry="9" fill="#ffcf5a" style="animation-delay:.2s"/>
      <ellipse class="flame" cx="136.500" cy="52" rx="5" ry="9" fill="#ffcf5a" style="animation-delay:.4s"/>
      <text x="110" y="186" text-anchor="middle" font-size="24" fill="#e86a9a">♥ ♥ ♥</text>
    </svg>
    <h2 id="fTitle"></h2>
    <p id="fText"></p>
    <p id="wish" hidden><strong>Pide un deseo, mi pedacito de cielo.</strong></p>
    <button class="btn" id="blow">Soplar las velitas</button>
    <button class="link" id="again">Volver a empezar</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/validation.js"></script>
<script src="js/storage.js"></script>
<script src="js/services.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
